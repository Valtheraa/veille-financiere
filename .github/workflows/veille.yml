name: Collecte de la veille

on:
  schedule:
    # Toutes les heures, de 5 h à 21 h UTC (heures utiles en France).
    - cron: "7 5-21 * * *"
  workflow_dispatch: # bouton « Run workflow » pour forcer une collecte

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  collecter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r collector/requirements.txt

      - name: Collecter
        env:
          # Facultatif : ajoute le secret ANTHROPIC_API_KEY pour le résumé du jour.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python collector/fetch.py --resume

      - name: Publier si quelque chose a changé
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add docs/data/feed.json
          if git diff --staged --quiet; then
            echo "Rien de neuf, pas de commit."
          else
            git commit -m "veille : $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
