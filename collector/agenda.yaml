# =====================================================================
#  Les rendez-vous à anticiper.
#  Écritures possibles :
#    date: 2026-12-09                      une date précise
#    recurrent: annuel   + jour: "01-02"   (jour-mois)
#    recurrent: mensuel  + jour: 15        (ou jour: dernier)
#    recurrent: mensuel  + jour: 1er vendredi
#  Les dates de la BCE et de la Fed sont publiées un an à l'avance :
#  à recompléter chaque automne depuis ecb.europa.eu et federalreserve.gov.
# =====================================================================

rendez_vous:

