  - label: Inflation zone euro, première estimation
    recurrent: mensuel
    jour: 2
    detail: Eurostat
  - label: Chômage zone euro
    recurrent: mensuel
    jour: 3
    detail: Eurostat
  - label: Croissance du PIB français
    recurrent: mensuel
    jour: 30
    detail: Insee, publication trimestrielle fin janvier, avril, juillet et octobre

  # ---------- échéances françaises ----------
  - label: Révision du Livret A, du LDDS et du LEP
