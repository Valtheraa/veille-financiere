  # ---------- comptes rendus ----------
  - label: Compte rendu de la dernière réunion de la Fed
    recurrent: mensuel
    jour: 20
    detail: publié environ trois semaines après chaque décision

  # ---------- statistiques américaines ----------
  - label: Emploi américain (chiffres mensuels)
    recurrent: mensuel
    jour: 1er vendredi
    detail: créations d'emplois et taux de chômage, 14h30 heure de Paris
  - label: Inflation américaine
    recurrent: mensuel
    jour: 12
    detail: indice des prix à la consommation, 14h30 heure de Paris

  # ---------- statistiques françaises et européennes ----------
  - label: Inflation France, première estimation
