    mots: OAT

  - id: spread_oat_bund
    label: Écart France / Allemagne
    pays: fr
    theme: dette
    unite: pt
    source: calcule
    formule: oat_10a - bund_10a
    note: le thermomètre du risque politique français
    mots: écart de taux

  - id: dette_fr
    label: Dette publique France
    pays: fr
    theme: finances_publiques
    unite: "% du PIB"
    source: eurostat
    cle: gov_10q_ggdebt
    filtres: geo=FR&sector=S13&na_item=GD&unit=PC_GDP
    mots: dette

  - id: deficit_fr
    label: Déficit public France
    pays: fr
    theme: finances_publiques
    unite: "% du PIB"
    source: eurostat
    cle: gov_10dd_edpt1
    filtres: geo=FR&sector=S13&na_item=B9&unit=PC_GDP
    mots: déficit

  - id: inflation_fr
    label: Inflation France
    pays: fr
    theme: inflation
    unite: "%"
    source: eurostat
    cle: prc_hicp_manr
    variantes:
      - {cle: prc_hicp_manr, filtres: "geo=FR&coicop=CP00&unit=RCH_A"}
      - {cle: ei_cphi_m, filtres: "geo=FR&indic=CP-HI00&unit=RCH_A&s_adj=NSA"}
      - {cle: prc_hicp_manr, filtres: "geo=FR&coicop=CP00"}
    note: sur un an
    mots: inflation

  - id: chomage_fr
    label: Chômage France
    pays: fr
    theme: emploi
    unite: "%"
    source: eurostat
    cle: une_rt_m
    filtres: geo=FR&sex=T&age=TOTAL&unit=PC_ACT&s_adj=SA
    mots: chômage

  - id: pib_fr
    label: Croissance du PIB France
    pays: fr
    theme: croissance
    unite: "%"
    source: eurostat
    cle: namq_10_gdp
    filtres: geo=FR&na_item=B1GQ&unit=CLV_PCH_SM&s_adj=SCA
    note: sur un an
    mots: croissance

  - id: production_fr
    label: Production industrielle France
    pays: fr
    theme: activite
    unite: "%"
    source: eurostat
    cle: sts_inpr_m
    filtres: geo=FR&nace_r2=B-D&unit=PCH_SM&s_adj=CA
    note: sur un an

  - id: livret_a
    label: Livret A et LDDS
    revision: semestriel
    pays: fr
    theme: epargne
    unite: "%"
    source: epargne_fr
    webstat_termes: [livret A, épargne réglementée]
    webstat_motif: search(*, "livret A")
    valeur: 1.70          # repli si Webstat ne répond pas
    date: 2026-08-01
    mots: livret A


  - id: lep
    label: LEP
    revision: semestriel
    pays: fr
    theme: epargne
    unite: "%"
    source: epargne_fr
    webstat_termes: [LEP, épargne populaire, épargne réglementée]
    webstat_motif: search(*, "populaire")
    valeur: 2.50          # repli si Webstat ne répond pas
    date: 2026-08-01
    mots: LEP

  - id: pel
    label: PEL ouvert en 2026
    revision: annuel
    pays: fr
    theme: epargne
    unite: "%"
    source: epargne_fr
    webstat_termes: [plan d'épargne logement, épargne logement]
    webstat_motif: search(*, "logement")
    valeur: 2.00          # repli si Webstat ne répond pas
    date: 2026-01-01
    note: taux brut, avant impôt
    mots: PEL


  - id: livret_a_reel
    label: Ce que rapporte vraiment le Livret A
    pays: fr
    theme: epargne
    unite: pt
    source: calcule
    formule: livret_a - inflation_fr
    note: taux du Livret A moins l'inflation ; négatif, ton épargne perd du pouvoir d'achat




  - id: cac40
    label: CAC 40
    pays: fr
    theme: marches
    unite: pts
    source: marche
    cle: "^FCHI"
    secours: "^cac"
    mots: CAC 40

  # ============ ÉTATS-UNIS ============
  # Ce que tout le monde appelle « le taux directeur » : la cible annoncée par
  # la Fed. Elle ne bouge qu'à chaque décision, contrairement au taux constaté.
  - id: fed_directeur
    label: Taux directeur Fed
    pays: us
    theme: politique_monetaire
    unite: "%"
    source: fred
    cle: DFEDTARU
    note: cible annoncée par la Fed, haut de la fourchette — nécessite la clé FRED
    mots: Fed

  # Le taux réellement pratiqué entre banques. Il suit la cible avec un jour de
  # décalage : le jour d'une décision, les deux diffèrent forcément.
  - id: fed_effectif
    label: Taux effectif Fed
    pays: us
    theme: politique_monetaire
    unite: "%"
    source: fed
    cle: unsecured/effr
    note: constaté sur le marché, publié avec un jour de retard sur la décision
    mots: Fed

  - id: fed_sofr
    label: Taux interbancaire États-Unis
    note: "SOFR : l'équivalent américain du taux au jour le jour"
    pays: us
    theme: taux_marche
    unite: "%"
    source: fed
    cle: secured/sofr

  - id: treasury_10a
    label: Taux 10 ans États-Unis
    pays: us
    theme: dette
    unite: "%"
    source: tresor_us
    cle: "10 Yr"
    note: le taux qui commande tous les marchés mondiaux
    mots: taux américain

  - id: treasury_2a
    label: Taux 2 ans États-Unis
    pays: us
    theme: dette
    unite: "%"
    source: tresor_us
    cle: "2 Yr"

  - id: chomage_us
    label: Chômage États-Unis
    pays: us
    theme: emploi
    unite: "%"
    source: bls
    cle: LNS14000000
    mots: chômage

  - id: inflation_us
    label: Inflation États-Unis
    pays: us
    theme: inflation
    unite: "%"
    source: bls
    cle: CUUR0000SA0
    calcul: variation_annuelle
    note: sur un an
    mots: inflation

  - id: emplois_us
    label: Créations d'emplois États-Unis
    pays: us
    theme: emploi
    unite: milliers
    source: fred
    cle: PAYEMS
    transformation: chg
    note: sur un mois, hors agriculture — nécessite la clé FRED
    mots: emploi américain

  - id: pib_us
    label: Croissance du PIB États-Unis
    pays: us
    theme: croissance
    unite: "%"
    source: fred
    cle: A191RL1Q225SBEA
    note: rythme annualisé du trimestre — nécessite la clé FRED
    mots: croissance

  - id: sp500
