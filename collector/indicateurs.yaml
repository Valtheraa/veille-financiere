# =====================================================================
#  Les chiffres du tableau de bord.
#  Deux axes, comme Trading Economics : un PAYS, un THÈME.
#  Les noms sont ceux qu'on emploie en parlant, pas ceux des économistes.
#
#  Sources, toutes gratuites :
#    bce       portail de données BCE — zone euro, France, pays membres
#    fed       taux de référence de la Fed de New York
#    boe       Banque d'Angleterre
#    tresor_us courbe des taux du Trésor américain
#    bls       statistiques du travail américaines (25 appels par jour, sans clé)
#    fred      base de la Fed de Saint-Louis — clé gratuite, secret FRED_API_KEY
#    marche    Yahoo Finance, Stooq en secours
#    change    Frankfurter (taux BCE)
#    crypto / global / peur   CoinGecko et Fear & Greed
#    manuel    valeur saisie ici
#    calcule   dérivé d'autres lignes
#
#  Sans clé FRED, les lignes américaines marquées `source: fred` restent
#  indisponibles ; chômage et inflation US passent par le BLS et fonctionnent.
# =====================================================================

pays:
  - id: fr
    label: France
  - id: ze
    label: Zone euro
  - id: us
    label: États-Unis
  - id: gb
    label: Royaume-Uni
  - id: de
    label: Allemagne
  - id: it
    label: Italie
  - id: jp
    label: Japon
  - id: ch
    label: Suisse
  - id: ca
    label: Canada
  - id: monde
    label: Monde

# Les trois chiffres affichés en haut de page suivent le pays choisi : sur
# l'onglet États-Unis, on ne veut pas lire le taux de la BCE.
heros:
  fr: [oat_10a, cac40, inflation_fr]
  ze: [bce_depot, stoxx600, inflation_ze]
  us: [fed_directeur, fed_effectif, sp500, inflation_us]
  gb: [boe_directeur, ftse]
  de: [bund_10a, dax, inflation_de]
  it: [btp_10a, inflation_it, chomage_it]
  jp: [boj_directeur, nikkei, eurjpy]
  ch: [snb_directeur, eurchf]
  ca: [boc_directeur, eurcad]
  monde: [btc, or, brent]

themes:
  - id: politique_monetaire
    label: Politique monétaire
  - id: taux_marche
    label: Taux de marché
  - id: dette
    label: Dette et taux longs
  - id: inflation
    label: Inflation
  - id: emploi
    label: Emploi
  - id: croissance
    label: Croissance
  - id: activite
    label: Activité et commerce
  - id: finances_publiques
    label: Finances publiques
  - id: epargne
    label: Épargne réglementée
  - id: credit
    label: Immobilier
  - id: marches
    label: Marchés actions
  - id: devises
    label: Devises
  - id: matieres
    label: Matières premières
  - id: crypto
    label: Crypto

indicateurs:

  # ============ ZONE EURO ============
  - id: bce_depot
    label: Taux directeur BCE
    pays: ze
    theme: politique_monetaire
    unite: "%"
    source: bce
    cle: FM/D.U2.EUR.4F.KR.DFR.LEV
    note: taux de la facilité de dépôt, celui qui pilote la rémunération de l'épargne
    mots: BCE

  - id: bce_refi
    label: Taux des prêts aux banques
    note: taux auquel la BCE refinance les banques commerciales
    pays: ze
    theme: politique_monetaire
    unite: "%"
    source: bce
    cle: FM/D.U2.EUR.4F.KR.MRR_FR.LEV
    mots: BCE

  - id: bce_marginal
    label: Taux du prêt marginal BCE
    pays: ze
    theme: politique_monetaire
    unite: "%"
    source: bce
    cle: FM/D.U2.EUR.4F.KR.MLFR.LEV
    actif: false

  - id: ester
    label: Taux interbancaire zone euro
    note: "€STR : ce que les banques se prêtent entre elles au jour le jour"
    pays: ze
    theme: taux_marche
    unite: "%"
    source: bce
    cle: EST/B.EU000A2X2A25.WT
    mots: €STR

  - id: euribor_3m
    label: Euribor 3 mois
    pays: ze
    theme: taux_marche
    unite: "%"
    source: bce
    cle: FM/M.U2.EUR.RT.MM.EURIBOR3MD_.HSTA
    note: la référence des crédits à taux variable
    mots: Euribor

  - id: euribor_12m
    label: Euribor 12 mois
    pays: ze
    theme: taux_marche
    unite: "%"
    source: bce
    cle: FM/M.U2.EUR.RT.MM.EURIBOR1YD_.HSTA
    mots: Euribor

  - id: inflation_ze
    label: Inflation zone euro
    pays: ze
    theme: inflation
    unite: "%"
    source: eurostat
    cle: prc_hicp_manr
    variantes:
      - {cle: prc_hicp_manr, filtres: "geo=EA&coicop=CP00&unit=RCH_A"}
      - {cle: prc_hicp_manr, filtres: "geo=EA20&coicop=CP00&unit=RCH_A"}
      - {cle: ei_cphi_m, filtres: "geo=EA20&indic=CP-HI00&unit=RCH_A&s_adj=NSA"}
      - {cle: prc_hicp_manr, filtres: "geo=EA&coicop=CP00"}
    mots: inflation

  - id: inflation_sousjacente_ze
    label: Inflation hors énergie et alimentation
    pays: ze
    theme: inflation
    unite: "%"
    source: eurostat
    cle: prc_hicp_manr
    variantes:
      - {cle: prc_hicp_manr, filtres: "geo=EA&coicop=TOT_X_NRG_FOOD&unit=RCH_A"}
      - {cle: prc_hicp_manr, filtres: "geo=EA20&coicop=TOT_X_NRG_FOOD&unit=RCH_A"}
      - {cle: ei_cphi_m, filtres: "geo=EA20&indic=CP-HIX&unit=RCH_A&s_adj=NSA"}

  - id: chomage_ze
    label: Chômage zone euro
    pays: ze
    theme: emploi
    unite: "%"
    source: eurostat
    cle: une_rt_m
    variantes:
      - {cle: une_rt_m, filtres: "geo=EA20&sex=T&age=TOTAL&unit=PC_ACT&s_adj=SA"}
      - {cle: une_rt_m, filtres: "geo=EA&sex=T&age=TOTAL&unit=PC_ACT&s_adj=SA"}
      - {cle: une_rt_m, filtres: "geo=EA19&sex=T&age=TOTAL&unit=PC_ACT&s_adj=SA"}
    mots: chômage

  - id: pib_ze
    label: Croissance du PIB zone euro
    pays: ze
    theme: croissance
    unite: "%"
    source: eurostat
    cle: namq_10_gdp
    filtres: geo=EA20&na_item=B1GQ&unit=CLV_PCH_SM&s_adj=SCA
    note: sur un an
    mots: croissance

  - id: stoxx600
    label: Stoxx Europe 600
    pays: ze
    theme: marches
    unite: pts
    source: marche
    cle: "^STOXX"

  # ============ FRANCE ============
  - id: oat_10a
    label: Taux 10 ans France
    pays: fr
    theme: dette
    unite: "%"
    source: bce
    cle: IRS/M.FR.L.L40.CI.0000.EUR.N.Z
