# =====================================================================
#  Sources de la veille. Tout est gratuit et sans clé d'API.
#  Pour ajouter une source : copie un bloc, change l'URL.
#  Pour en retirer une : mets `actif: false` (plus lisible que supprimer).
#  Vérifie l'état de tout : python collector/fetch.py --check
# =====================================================================

# `conserver: N` garde les articles d'une source N jours au lieu de 21.
# `secours_q: '…'` : si le flux direct tombe (404, 403, site refait), le
# collecteur bascule tout seul sur une recherche limitée au même sujet.
# Chaque source est plafonnée à 30 articles par collecte.
# Catégories affichées dans le tableau de bord, dans cet ordre.
categories:
  - id: taux
    label: Taux & crédit
  - id: marches
    label: Marchés & ETF
  - id: crypto
    label: Crypto
  - id: macro
    label: Macro & régulation
  - id: geo
    label: Géopolitique

# ---------------------------------------------------------------------
# Flux RSS officiels : la source la plus fiable, publiée par l'émetteur.
# ---------------------------------------------------------------------
flux:
  - nom: Banque centrale européenne
    url: https://www.ecb.europa.eu/rss/press.html
    categorie: macro
    poids: 3
    actif: true
    secours_q: 'BCE OR "Banque centrale européenne"'

  # Ce flux a disparu du site de la BCE ; les décisions passent de toute façon
  # par le flux « press » ci-dessus.
  - nom: BCE — décisions de politique monétaire
    url: https://www.ecb.europa.eu/rss/pressconf.html
    categorie: taux
    poids: 3
    actif: false

  - nom: Réserve fédérale américaine
    url: https://www.federalreserve.gov/feeds/press_monetary.xml
    categorie: macro
    poids: 3
    actif: true
    secours_q: '"Federal Reserve" (rates OR FOMC OR inflation)'

  - nom: Banque de France
    url: https://www.banque-france.fr/rss.xml
    categorie: macro
    poids: 2
    actif: true
    conserver: 180   # publications de fond : gardées six mois
    secours_q: '"Banque de France" (taux OR épargne OR crédit OR conjoncture)'

  - nom: AMF
    url: https://www.amf-france.org/fr/rss.xml
    categorie: macro
    poids: 3
    actif: true
    conserver: 180   # publications de fond : gardées six mois
    secours_q: 'site:amf-france.org OR ("AMF" (épargnants OR agrément OR sanction OR mise en garde))'

  - nom: INSEE — informations rapides
    url: https://www.insee.fr/fr/information/rss/1
    categorie: macro
    poids: 2
    actif: true
    conserver: 180   # publications de fond : gardées six mois
    secours_q: 'site:insee.fr OR (Insee (inflation OR chômage OR croissance OR "informations rapides"))'

  - nom: BOFiP — actualités fiscales
    url: https://bofip.impots.gouv.fr/rss/actualites
    categorie: macro
    poids: 3
    actif: true
    conserver: 180   # publications de fond : gardées six mois
    secours_q: 'BOFiP OR site:impots.gouv.fr OR ("administration fiscale" doctrine)'

  - nom: ACPR
    url: https://acpr.banque-france.fr/rss.xml
    categorie: macro
    poids: 2
    actif: true
    conserver: 180   # publications de fond : gardées six mois
    secours_q: 'ACPR OR ("Autorité de contrôle prudentiel")'

  - nom: ESMA
    url: https://www.esma.europa.eu/rss.xml
    categorie: macro
    poids: 1
    actif: true
    conserver: 180   # publications de fond : gardées six mois
    secours_q: 'ESMA OR ("European Securities and Markets Authority")'

  - nom: Direction générale du Trésor
    url: https://www.tresor.economie.gouv.fr/rss
    categorie: macro
    poids: 1
    actif: true
    conserver: 180   # publications de fond : gardées six mois
    secours_q: 'site:tresor.economie.gouv.fr OR ("direction générale du Trésor")'

  - nom: Autorité bancaire européenne
    url: https://www.eba.europa.eu/rss.xml
    categorie: macro
    poids: 1
    actif: false

# ---------------------------------------------------------------------
# Requêtes Google Actualités : un flux RSS gratuit et illimité construit
# à partir de mots-clés. C'est ce qui couvre la presse française, dont
# les flux maison meurent ou changent d'adresse tout le temps.
# `q` accepte la syntaxe Google : guillemets, OR, -exclusion, site:.
# ---------------------------------------------------------------------
recherches:
  - nom: Crédit immobilier
    q: '"taux crédit immobilier" OR "baromètre des taux" OR "taux d''usure"'
    categorie: taux
    poids: 3
    actif: true

  - nom: Épargne réglementée
    q: '"livret A" OR "LEP" OR "taux du livret" OR "assurance vie" rendement'
    categorie: taux
    poids: 2
    actif: true

  - nom: Marchés actions
    q: 'CAC 40 OR "marchés actions" OR "Wall Street" séance'
    categorie: marches
    poids: 2
    actif: true

  - nom: ETF et PEA
    q: 'ETF OR "gestion passive" OR PEA OR "plan d''épargne en actions"'
    categorie: marches
    poids: 2
    actif: true

  - nom: Crypto
    q: 'bitcoin OR ethereum OR "crypto-actifs" OR MiCA'
    categorie: crypto
    poids: 2
    actif: true

  - nom: Fiscalité crypto France
    q: '"fiscalité des cryptomonnaies" OR "déclaration crypto" OR "3916-bis"'
    categorie: crypto
    poids: 3
    actif: true

  - nom: Banque de détail et courtage
    q: '"courtier en crédit" OR "conseiller en gestion de patrimoine" OR "courtage en assurance" OR "banque de détail"'
    categorie: macro
    poids: 1
    actif: true

  - nom: Fiscalité et loi de finances
    q: '"loi de finances" OR "prélèvement forfaitaire" OR "flat tax" OR BOFiP OR "abattement fiscal"'
    categorie: macro
    poids: 3
    actif: true

  - nom: Journal officiel et textes réglementaires
    q: '("Journal officiel" OR arrêté OR décret) (épargne OR livret OR crédit OR "taux d''usure" OR banque)'
    categorie: macro
    poids: 2
    actif: true

  - nom: Géopolitique à effet marché
    q: '(pétrole OR OPEP OR "droits de douane" OR sanctions OR "chaîne d''approvisionnement") (marchés OR bourse OR inflation)'
    categorie: geo
    poids: 2
    actif: true

  - nom: Tensions et énergie
    q: '(Moyen-Orient OR Taïwan OR Ukraine OR "mer Rouge") (énergie OR économie OR marchés)'
    categorie: geo
    poids: 1
    actif: true

# ---------------------------------------------------------------------
# Mots-clés qui font remonter un article en tête de liste.
# ---------------------------------------------------------------------
signaux_forts:
  - taux directeur
  - baisse des taux
  - hausse des taux
  - inflation
  - récession
  - krach
  - sanction
  - AMF
  - fraude
  - arnaque
  - livret A
  - taux d'usure
  - plafond
  - fiscalité
  - loi de finances
  - prélèvement forfaitaire

# ---------------------------------------------------------------------
# Bruit à écarter : titres qui contiennent un de ces termes sont ignorés.
# ---------------------------------------------------------------------
bruit:
  - horoscope
  - people
  - prix nobel de littérature
  - loterie
