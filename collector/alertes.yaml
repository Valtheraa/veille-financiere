# =====================================================================
#  Quand te prévenir. Une alerte crée une issue sur ton dépôt GitHub,
#  qui t'envoie un mail — aucune configuration, aucun serveur.
#  Conditions : change (toute variation), sup, inf, variation (en % sur 24 h).
#  Le déclenchement n'a lieu qu'au franchissement, pas tant que le seuil
#  reste dépassé.
# =====================================================================

regles:
  - indicateur: bce_depot
    condition: change
    message: La BCE a bougé son taux de dépôt

  - indicateur: fed_effr
    condition: change
    message: Le taux effectif de la Fed a changé

  - indicateur: livret_a
    condition: change
    message: Le taux du Livret A a changé

  - indicateur: spread_oat_bund
    condition: sup
    seuil: 0.80
    message: Écart France / Allemagne au-dessus de 80 points de base

  - indicateur: vix
    condition: sup
    seuil: 25
    message: Le VIX dépasse 25, les marchés ont peur

  - indicateur: oat_10a
    condition: sup
    seuil: 4.50
    message: L'OAT 10 ans dépasse 4,50 %

  - indicateur: cac40
    condition: variation
    seuil: 2.5
    message: Le CAC 40 bouge de plus de 2,5 % dans la journée

  - indicateur: btc
    condition: variation
    seuil: 8
    message: Le Bitcoin bouge de plus de 8 % en 24 h

  - indicateur: inflation_fr
    condition: change
    message: Nouveau chiffre d'inflation en France
