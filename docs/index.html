<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veille</title>
<meta name="description" content="Veille financière : taux, marchés, crypto, macro, géopolitique.">
<link rel="manifest" href="manifest.json">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0D0D0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --noir:#0D0D0F;
  --filet:rgba(255,255,255,.055);
  --bordure:rgba(255,255,255,.13);
  --texte:#F2EFE8;
  --doux:rgba(242,239,232,.46);
  --tres-doux:rgba(242,239,232,.26);
  --or:#C9A84C;
  --or-sombre:rgba(201,168,76,.62);
  --hausse:#3FA876;
  --baisse:#E0715F;
  --chiffre:"Fraunces",Georgia,serif;
  --sans:"Inter",system-ui,-apple-system,sans-serif;
  --pad:20px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--noir)}
body{
  color:var(--texte);font-family:var(--sans);font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding:0 var(--pad) calc(72px + env(safe-area-inset-bottom));
}
.page{max-width:1120px;margin:0 auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--or);outline-offset:4px}
.legende{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--or);font-weight:500;
}

/* ---------- en-tête ---------- */
.entete{display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:calc(22px + env(safe-area-inset-top)) 0 22px}
.marque{font-family:var(--chiffre);font-size:26px;font-weight:500;margin:0;letter-spacing:-.022em}
.etat-maj{font-size:12px;color:var(--tres-doux);font-variant-numeric:tabular-nums}
.etat-maj.perime{color:var(--or)}

/* ---------- hero ---------- */
.hero{display:grid;gap:28px;padding:6px 0 34px;border-bottom:1px solid var(--filet)}
.hero-secondaires{display:flex;gap:34px;flex-wrap:wrap}
@media(min-width:760px){.hero{grid-template-columns:1.5fr 1fr;align-items:end;gap:44px}}
.hero-nom{margin:0 0 10px}
.hero-valeur{font-family:var(--chiffre);font-weight:500;line-height:.94;
  font-size:clamp(52px,12vw,76px);letter-spacing:-.022em;font-variant-numeric:tabular-nums}
.hero-sec .hero-valeur{font-size:clamp(30px,7vw,38px)}
.hero-pied{margin-top:8px;font-size:13px;color:var(--doux)}
.resume{grid-column:1/-1;font-family:var(--chiffre);font-weight:400;
  font-size:clamp(17px,2.6vw,21px);line-height:1.5;color:var(--texte);
  max-width:64ch;border-left:2px solid var(--or);padding-left:16px;margin:4px 0 0}

/* ---------- chiffres ---------- */
.chiffres{display:grid;gap:38px 52px;padding:26px 0 6px;align-items:start}
@media(min-width:760px){.chiffres{grid-template-columns:1fr 1fr}}
@media(min-width:1040px){.chiffres{grid-template-columns:1fr 1fr 1fr}}
.groupe-tete{display:flex;align-items:center;justify-content:space-between;
  gap:12px;margin-bottom:6px;padding-bottom:8px;min-height:22px;
  border-bottom:1px solid var(--bordure)}
.bloc .ligne:first-of-type{border-top:none}
.ligne{display:flex;align-items:baseline;justify-content:space-between;gap:14px;
  padding:11px 0;border-top:1px solid var(--filet)}
.ligne-nom{min-width:0}
.ligne-nom .nom{display:block}
.ligne-nom .note{display:block;font-size:11.5px;color:var(--tres-doux);margin-top:2px;max-width:34ch}
.ligne-val{display:flex;align-items:center;gap:12px;flex-shrink:0;text-align:right}
.courbe{width:52px;height:15px;fill:none;stroke-width:1;opacity:.75;flex-shrink:0}
.alertes{border-left:2px solid var(--or);padding:2px 0 2px 16px;margin:0 0 26px}
.alertes p{margin:0 0 4px;font-size:14px}
.alertes .valeur{font-family:var(--chiffre);font-weight:500;letter-spacing:-.022em}
.agenda{padding:26px 0 4px}
.agenda .ligne-nom .nom{font-size:14.5px}
.agenda .quand{font-size:12.5px;color:var(--doux);font-variant-numeric:tabular-nums;white-space:nowrap}
.agenda .quand.proche{color:var(--or)}
.reprises{font-size:12.5px;color:var(--tres-doux);margin:7px 0 0}
.epingler{color:var(--tres-doux);border-bottom:1px solid transparent;font-size:12.5px;
  display:inline-flex;align-items:center;gap:5px}
.epingler svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.epingler[aria-pressed="true"]{color:var(--or)}
.epingler[aria-pressed="true"] svg{fill:var(--or);stroke:var(--or)}
.archive{margin-top:26px;padding-top:18px;border-top:1px solid var(--filet)}
.archive .ligne{padding:9px 0}
.archive .ligne-nom .nom{font-size:14px}
.lectures{padding:26px 0 4px;border-top:1px solid var(--filet);margin-top:26px}
.lectures .barre{height:2px;background:var(--or);opacity:.55;margin-top:6px}
.lectures .ligne{padding:9px 0;align-items:center}
.muet{color:var(--tres-doux);font-size:12.5px}
.reprises a{border-bottom:1px solid var(--filet)}
.val{font-family:var(--chiffre);font-size:19px;font-weight:500;letter-spacing:-.022em;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.var{font-size:12.5px;font-variant-numeric:tabular-nums;min-width:58px;color:var(--tres-doux)}
.var.pos{color:var(--hausse)} .var.neg{color:var(--baisse)}
.var.neutre{color:var(--tres-doux)}
.recherche-chiffres{flex:1;min-width:140px;max-width:280px;font-size:13px;padding:4px 0;
  border:none;border-bottom:1px solid var(--filet);background:transparent}
.familles{align-items:center}
.ligne.vide{opacity:.42}
.vers-articles{display:block;margin-top:3px;font-size:11.5px;color:var(--tres-doux);
  border-bottom:1px solid var(--filet);padding-bottom:1px;opacity:.42}
.ligne:hover .vers-articles,.ligne:focus-within .vers-articles{opacity:1}
.vers-articles:hover{color:var(--or);border-bottom-color:var(--or-sombre)}
@media (hover:none){.vers-articles{opacity:.62}}
.ligne.vide .note{color:var(--or-sombre)}
.ligne.vide .val{font-family:var(--sans);font-size:12.5px;color:var(--doux)}
.bascule-devise{display:flex;gap:2px;align-items:center}
.bascule-devise button{font-size:11px;letter-spacing:.08em;color:var(--tres-doux);padding:3px 7px;border-radius:999px}
.bascule-devise button[aria-pressed="true"]{color:#12100A;background:var(--or);font-weight:600}

/* ---------- filtres ---------- */
.vues{position:sticky;top:0;z-index:6;background:var(--noir);display:flex;gap:26px;
  padding:16px 0 0;margin-top:30px;border-top:1px solid var(--filet);
  box-shadow:0 12px 16px -12px var(--noir)}
.vue{font-size:15px;color:var(--doux);padding:10px 0 12px;border-bottom:1px solid transparent;
  white-space:nowrap}
.vue[aria-pressed="true"]{color:var(--texte);border-bottom-color:var(--or)}
.vue .n{font-size:11px;color:var(--or);margin-left:6px;font-variant-numeric:tabular-nums;
  vertical-align:super}
.familles{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;
  padding:16px 0 0;margin-bottom:4px}
.familles::-webkit-scrollbar{display:none}
.famille{font-size:13px;color:var(--tres-doux);white-space:nowrap;padding:4px 0;
  border-bottom:1px solid transparent}
.famille[aria-pressed="true"]{color:var(--or);border-bottom-color:var(--filet)}
.vide-vue{padding:40px 0;color:var(--doux);max-width:40ch}
.filtres{padding:16px 0 12px;border-top:1px solid var(--filet);margin-top:4px}
.onglets{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.onglets::-webkit-scrollbar{display:none}
.onglet{white-space:nowrap;font-size:13.5px;color:var(--doux);padding:5px 0;
  border-bottom:1px solid transparent}
.onglet[aria-pressed="true"]{color:var(--texte);border-bottom-color:var(--or)}
.onglet .n{font-size:11px;color:var(--or);margin-left:5px;font-variant-numeric:tabular-nums}
.outils{display:flex;gap:14px 18px;align-items:center;margin-top:14px;flex-wrap:wrap}
.outils .recherche{min-width:min(100%,260px)}
.recherche{flex:1;background:transparent;border:none;border-bottom:1px solid var(--filet);
  padding:7px 0;color:var(--texte);font-size:14px}
.recherche::placeholder{color:var(--tres-doux)}
.recherche:focus{outline:none;border-bottom-color:var(--or-sombre)}
.bascule{font-size:13px;color:var(--doux);display:flex;align-items:center;gap:8px;white-space:nowrap}
.bascule input{accent-color:var(--or);width:16px;height:16px}

/* ---------- flux ---------- */
.jour{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--or);
  font-weight:500;margin:34px 0 10px;padding-top:16px;border-top:1px solid var(--filet)}
.jour:first-of-type{margin-top:18px;border-top:none;padding-top:0}
.article{display:block;padding:18px 0 18px 14px;border-top:1px solid var(--filet);
  border-left:2px solid transparent}
.article:first-of-type{border-top:none}
.article.marquant{border-left-color:var(--or)}
.article.lu{opacity:.42}
.article{position:relative}
.titre{display:block;font-family:var(--chiffre);font-weight:500;font-size:17.5px;
  line-height:1.42;letter-spacing:-.022em;margin:0 0 7px;max-width:64ch}
.meta{font-size:12.5px;color:var(--tres-doux);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.puce{width:5px;height:5px;background:var(--or);display:inline-block}
.signal{color:var(--or-sombre)}
.extrait{font-size:13.5px;color:var(--doux);margin:7px 0 0;max-width:70ch;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* ---------- états ---------- */
.etat{padding:46px 0;max-width:44ch}
.etat h2{font-family:var(--chiffre);font-weight:500;letter-spacing:-.022em;font-size:20px;margin:0 0 8px}
.etat p{margin:0;color:var(--doux)}
.pied{margin-top:46px;padding-top:18px;border-top:1px solid var(--filet);
  display:flex;gap:22px;flex-wrap:wrap;font-size:12.5px;color:var(--tres-doux)}
.pied button{color:var(--doux);border-bottom:1px solid var(--bordure);padding-bottom:1px}
.pied .primaire{background:var(--or);color:#12100A;font-weight:600;font-size:13px;
  padding:9px 18px;border-radius:13px;border-bottom:none}
.copier{color:var(--doux);border-bottom:1px solid var(--bordure);padding-bottom:1px;
  font-size:12.5px;display:inline-flex;align-items:center;gap:5px}
.copier svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.copier[data-fait="oui"]{color:var(--or);border-bottom-color:transparent}
.article .copier,.article .epingler{opacity:.42}
.article:hover .copier,.article:hover .epingler,
.article:focus-within .copier,.article:focus-within .epingler{opacity:1}
.epingler[aria-pressed="true"]{opacity:1}
@media (hover:none){.article .copier,.article .epingler{opacity:.62}}
.copier-tout{color:var(--doux);font-size:13px;border-bottom:1px solid var(--bordure);
  padding-bottom:1px;white-space:nowrap}
.copier-tout[data-fait="oui"]{color:var(--or);border-bottom-color:transparent}
@media (prefers-reduced-motion:no-preference){
  .onglet,.pied button,.bascule-devise button{transition:color .15s ease}
}
</style>
</head>
<body>
<div class="page">

  <header class="entete">
    <h1 class="marque">Veille</h1>
    <span class="etat-maj" id="etat-maj">chargement</span>
  </header>

  <section class="hero" id="hero" aria-label="Chiffres clés"></section>

  <section class="alertes" id="alertes" hidden aria-label="Alertes"></section>

  <nav class="vues" id="vues" aria-label="Vues"></nav>

  <div id="bloc-chiffres" hidden>
    <div class="familles" id="familles"></div>
    <section class="chiffres" id="chiffres" aria-label="Indicateurs"></section>
  </div>

  <div id="bloc-agenda" hidden>
    <section class="agenda" id="agenda" aria-label="Prochains rendez-vous"></section>
  </div>

  <div id="bloc-actus">
  <nav class="filtres" aria-label="Filtres">
    <div class="onglets" id="onglets"></div>
    <div class="outils">
      <input class="recherche" id="recherche" type="search" placeholder="Chercher un mot" aria-label="Chercher dans les titres">
      <label class="bascule"><input type="checkbox" id="neufs"> Nouveaux</label>
      <label class="bascule"><input type="checkbox" id="affinite"> Mes sources</label>
      <button class="copier-tout" id="copier-tout">Copier la sélection</button>
    </div>
  </nav>

  <main id="flux"></main>

  <section class="archive" id="archive" hidden aria-label="Archive"></section>
  </div>
  <section class="lectures" id="lectures" hidden aria-label="Ce que je lis"></section>

  <footer class="pied">
    <span id="etat-sources"></span>
    <button class="primaire" id="rafraichir">Recharger</button>
    <button id="tout-lu">Tout marquer comme lu</button>
    <button id="voir-lectures">Mes lectures</button>
    <button id="exporter">Sauvegarder mes gardés</button>
    <button id="importer">Restaurer</button>
  </footer>
</div>

<script>
function signalerErreur(origine, erreur){
  const message = (erreur && (erreur.message || erreur)) + "";
  const etat = document.getElementById("etat-maj");
  if (etat) etat.textContent = "erreur";
  const flux = document.getElementById("flux");
  if (flux) flux.innerHTML = `<div class="etat">
    <h2>Le tableau de bord n'a pas pu s'afficher.</h2>
    <p>${origine} — ${message}</p>
    <p class="muet" style="margin-top:10px">Recopie cette ligne, elle suffit à identifier la panne.</p></div>`;
}
addEventListener("error", (e) => signalerErreur("Erreur de script", e.error || e.message));
addEventListener("unhandledrejection", (e) => signalerErreur("Promesse rejetée", e.reason));

const CLE_VISITE = "veille:derniere-visite";
const CLE_LUS = "veille:lus";
const CLE_DEVISE = "veille:devise";
const CLE_EPINGLES = "veille:epingles";
const CLE_VUE = "veille:vue";
const CLE_PAYS = "veille:pays";
const CLE_LECTURES = "veille:lectures";

const stockage = {
  lire(cle, defaut){ try{ const v=localStorage.getItem(cle); return v===null?defaut:JSON.parse(v);}catch{ return defaut; } },
  ecrire(cle, valeur){ try{ localStorage.setItem(cle, JSON.stringify(valeur)); }catch{} }
};

let donnees = null;
let categorieActive = "tout";
let devise = stockage.lire(CLE_DEVISE, "EUR");
let lus = new Set(stockage.lire(CLE_LUS, []));
let epingles = stockage.lire(CLE_EPINGLES, []);
let lectures = stockage.lire(CLE_LECTURES, {});
let archive = null;
let combienAffiches = 60;
const PAS_AFFICHAGE = 60;
const visitePrecedente = stockage.lire(CLE_VISITE, null);

function ech(valeur){
  return String(valeur ?? "").replace(/[&<>"']/g, (c) =>
    ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

const fr = {
  heure: new Intl.DateTimeFormat("fr-FR",{hour:"2-digit",minute:"2-digit"}),
  jour: new Intl.DateTimeFormat("fr-FR",{weekday:"long",day:"numeric",month:"long"}),
  court: new Intl.DateTimeFormat("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}),
  date: new Intl.DateTimeFormat("fr-FR",{day:"numeric",month:"short",year:"numeric"})
};

const estNouveau = (a) => !visitePrecedente || a.premiere_vue > visitePrecedente;
const parId = (id) => (donnees.indicateurs || []).find(i => i.id === id);

/* ---------- mise en forme des valeurs ---------- */

function valeurAffichee(ind){
  const enDollar = devise === "USD" && ind.valeur_usd !== null && ind.valeur_usd !== undefined;
  const brut = enDollar ? ind.valeur_usd : ind.valeur;
  if (brut === null || brut === undefined) return "—";

  let unite = ind.unite || "";
  if (enDollar) unite = unite.replace("€","$");

  let decimales = 2;
  if (unite === "%" || unite === "pt") decimales = 2;
  else if (ind.theme === "devises") decimales = 4;
  else if (Math.abs(brut) >= 1000) decimales = 0;
  else if (unite === "/100") decimales = 0;

  const nombre = brut.toLocaleString("fr-FR",{minimumFractionDigits:decimales,maximumFractionDigits:decimales});
  if (!unite) return nombre;
  if (unite === "%" || unite === "pt" || unite === "pts") return nombre + " " + unite;
  if (unite === "/100") return nombre + unite;
  return nombre + " " + unite;
}

function signe(valeur, decimales){
  const texte = Math.abs(valeur).toLocaleString("fr-FR",
    {minimumFractionDigits:decimales, maximumFractionDigits:decimales});
  return (valeur > 0 ? "+" : valeur < 0 ? "−" : "") + texte;
}

function variation(ind){
  if (ind.variation_pct !== null && ind.variation_pct !== undefined && ind.variation_pct !== 0){
    return { texte: signe(ind.variation_pct, 2) + " %", classe: ind.variation_pct > 0 ? "pos" : "neg" };
  }
  if (ind.variation !== null && ind.variation !== undefined && ind.variation !== 0){
    // Une variation de taux s'exprime en points, jamais en pourcents.
    const unite = (ind.unite === "%" || ind.unite === "pt") ? " pt" : "";
    return { texte: signe(ind.variation, 2) + unite, classe: ind.variation > 0 ? "pos" : "neg" };
  }
  return { texte:"—", classe:"neutre" };
}

// Les séries mensuelles (inflation, chômage) décrivent un mois passé :
// l'afficher évite de confondre le chiffre du mois avec celui du jour.
const moisFr = new Intl.DateTimeFormat("fr-FR", {month:"long", year:"numeric"});
function reference(ind){
  if (!ind.date) return "";
  const date = new Date(ind.date);
  if (isNaN(date)) return "";
  const jours = (Date.now() - date.getTime()) / 86400000;
  return jours > 20 ? moisFr.format(date) : "";
}

const PEUR = { "Extreme Fear":"peur extrême", "Fear":"peur", "Neutral":"neutre",
               "Greed":"avidité", "Extreme Greed":"avidité extrême" };

/* ---------- vues ---------- */

const VUES = [
  { id:"actus",    label:"Actualités" },
  { id:"chiffres", label:"Chiffres" },
  { id:"agenda",   label:"Agenda" },
];

// Deux axes, comme Trading Economics : on choisit un pays, on lit ses thèmes.
// « Le chômage en France » se trouve alors là où on le cherche.

let vueActive = stockage.lire(CLE_VUE, "actus");
let paysActif = stockage.lire(CLE_PAYS, "fr");
let filtreChiffres = "";

function afficherVues(){
  const barre = document.getElementById("vues");
  const neufs = donnees.articles.filter(estNouveau).length;
  const proches = (donnees.agenda || []).filter(r => r.jours <= 7).length;

  barre.innerHTML = "";
  for (const vue of VUES){
    const compte = vue.id === "actus" ? neufs : vue.id === "agenda" ? proches : 0;
    const bouton = document.createElement("button");
    bouton.className = "vue";
    bouton.setAttribute("aria-pressed", String(vue.id === vueActive));
    bouton.innerHTML = ech(vue.label) + (compte ? `<span class="n">${compte}</span>` : "");
    bouton.addEventListener("click", () => {
      vueActive = vue.id;
      stockage.ecrire(CLE_VUE, vue.id);
      afficherVues();
      scrollTo({ top: document.getElementById("vues").offsetTop - 8, behavior:"smooth" });
    });
    barre.appendChild(bouton);
  }
  // Le bouton doré porte l'action principale de la vue affichée, jamais autre chose.
  const dore = document.getElementById("rafraichir");
  const autre = document.getElementById("tout-lu");
  if (vueActive === "actus"){
    dore.textContent = "Tout marquer comme lu"; dore.onclick = marquerToutLu;
    autre.textContent = "Recharger"; autre.onclick = charger;
  } else {
    dore.textContent = "Recharger"; dore.onclick = charger;
    autre.textContent = "Tout marquer comme lu"; autre.onclick = marquerToutLu;
  }

  document.getElementById("bloc-chiffres").hidden = vueActive !== "chiffres";
  document.getElementById("bloc-agenda").hidden = vueActive !== "agenda";
  document.getElementById("bloc-actus").hidden = vueActive !== "actus";
  if (vueActive === "chiffres") afficherFamilles();
}

// Le collecteur et la page se déploient séparément : pendant le temps qui les
// sépare, la page peut recevoir des données d'une version antérieure. Elle
// doit rester lisible et le dire, jamais afficher un écran vide.
function donneesAnciennes(){
  return !(donnees.pays || []).length || !(donnees.indicateurs || []).some(i => i.pays);
}

function afficherFamilles(){
  const barre = document.getElementById("familles");
  barre.innerHTML = "";

  if (donneesAnciennes()){
    const avis = document.createElement("p");
    avis.className = "muet";
    avis.textContent = "Données produites par une version précédente du collecteur. "
      + "Relance une collecte pour retrouver le classement par pays.";
    barre.appendChild(avis);
    afficherChiffres();
    return;
  }

  const entrees = [{ id: "banques", label: "Banques centrales" },
                   { id: "cours", label: "Cours" }].concat(donnees.pays || []);
  for (const pays of entrees){
    const transversal = pays.id === "cours" || pays.id === "banques";
    if (!transversal && !(donnees.indicateurs || []).some(i => i.pays === pays.id)) continue;
    const bouton = document.createElement("button");
    bouton.className = "famille";
    bouton.setAttribute("aria-pressed", String(pays.id === paysActif));
    bouton.textContent = pays.label;
    bouton.addEventListener("click", () => {
      paysActif = pays.id;
      stockage.ecrire(CLE_PAYS, pays.id);
      afficherFamilles();
      afficherHero();
    });
    barre.appendChild(bouton);
  }

  const recherche = document.createElement("input");
  recherche.type = "search";
  recherche.className = "recherche recherche-chiffres";
  recherche.placeholder = "Chercher un indicateur";
  recherche.setAttribute("aria-label", "Chercher un indicateur dans tous les pays");
  recherche.value = filtreChiffres;
  recherche.addEventListener("input", (e) => { filtreChiffres = e.target.value.trim().toLowerCase(); afficherChiffres(); });
  barre.appendChild(recherche);

  afficherChiffres();
}

/* ---------- micro-courbes ---------- */

function courbe(id){
  const serie = (donnees.courbes || {})[id];
  if (!serie || serie.length < 4) return "";
  const min = Math.min(...serie), max = Math.max(...serie);
  const etendue = (max - min) || 1;
  const L = 52, H = 15;
  const points = serie.map((v,i) =>
    `${(i/(serie.length-1)*L).toFixed(1)},${(H - ((v-min)/etendue)*H).toFixed(1)}`).join(" ");
  const monte = serie[serie.length-1] >= serie[0];
  return `<svg class="courbe" viewBox="0 0 ${L} ${H}" preserveAspectRatio="none" aria-hidden="true">
    <polyline points="${points}" stroke="${monte ? "var(--hausse)" : "var(--baisse)"}"/></svg>`;
}

/* ---------- tous les chiffres ---------- */

function afficherChiffres(){
  const cible = document.getElementById("chiffres");
  cible.innerHTML = "";
  const tous = donnees.indicateurs || [];
  const nomPays = Object.fromEntries((donnees.pays || []).map(p => [p.id, p.label]));

  // Une recherche traverse tous les pays ; sinon on reste sur le pays choisi.
  // « Cours » traverse les pays : indices, crypto, devises et matières ensemble.
  const THEMES_COURS = ["marches", "crypto", "devises", "matieres"];
  const retenus = filtreChiffres
    ? tous.filter(i => (i.label + " " + (nomPays[i.pays] || "")).toLowerCase().includes(filtreChiffres))
    : donneesAnciennes() ? tous
    : paysActif === "cours" ? tous.filter(i => THEMES_COURS.includes(i.theme))
    : paysActif === "banques" ? tous.filter(i => i.theme === "politique_monetaire")
    : tous.filter(i => i.pays === paysActif);

  if (!retenus.length){
    cible.innerHTML = `<p class="vide-vue">Aucun indicateur ne correspond.</p>`;
    return;
  }

  // `themes` aujourd'hui, `groupes` dans l'ancien format.
  const rubriques = (donnees.themes || donnees.groupes || []);
  const cle = donnees.themes ? "theme" : "groupe";
  const groupes = rubriques.filter(t => retenus.some(i => i[cle] === t.id));

  for (const groupe of groupes){
    const membres = retenus.filter(i => i[cle] === groupe.id);
    if (!membres.length) continue;

    const bloc = document.createElement("section");
    const tete = document.createElement("div");
    tete.className = "groupe-tete";
    const periodes = [...new Set(membres.map(m => m.periode).filter(Boolean))];
    const periodeCommune = periodes.length === 1 ? `variations sur ${periodes[0]}` : "";
    const mois = [...new Set(membres.map(reference).filter(Boolean))];
    const moisCommun = (mois.length === 1 && mois.length === membres.filter(m => reference(m)).length) ? mois[0] : "";
    tete.innerHTML = `<span class="legende">${ech(groupe.label)}${
      filtreChiffres ? "" : ""}</span>` +
      ((moisCommun || periodeCommune)
        ? `<span class="muet">${ech([moisCommun, periodeCommune].filter(Boolean).join(" — "))}</span>`
        : "");
    groupe._moisCommun = moisCommun;

    if (membres.some(m => m.valeur_usd !== null && m.valeur_usd !== undefined)){
      const bascule = document.createElement("div");
      bascule.className = "bascule-devise";
      for (const code of ["EUR","USD"]){
        const b = document.createElement("button");
        b.textContent = code === "EUR" ? "€" : "$";
        b.setAttribute("aria-label", code === "EUR" ? "Afficher en euros" : "Afficher en dollars");
        b.setAttribute("aria-pressed", String(devise === code));
        b.addEventListener("click", () => {
          devise = code;
          stockage.ecrire(CLE_DEVISE, code);
          afficherHero();
          afficherChiffres();
        });
        bascule.appendChild(b);
      }
      tete.appendChild(bascule);
    }
    bloc.appendChild(tete);

    for (const ind of membres){
      const ligne = document.createElement("div");
      const v = variation(ind);
      if (ind.statut !== "ok"){
        ligne.className = "ligne vide";
        if (ind.statut === "perime"){
          ligne.innerHTML = `<span class="ligne-nom"><span class="nom">${ech(ind.label)}</span>
              <span class="note">série arrêtée par la source</span></span>
            <span class="ligne-val"><span class="val">${valeurAffichee(ind)}</span>
              <span class="var neutre">${ech(reference(ind) || ind.date || "")}</span></span>`;
          bloc.appendChild(ligne);
          continue;
        }
        const raison = /FRED/.test(`${ind.note || ""} ${ind.erreur || ""}`) ? "clé FRED manquante" : "";
        ligne.innerHTML = `<span class="ligne-nom"><span class="nom">${ech(ind.label)}</span>
            ${raison ? `<span class="note">${ech(raison)}</span>` : ""}</span>
          <span class="ligne-val"><span class="val">indisponible</span></span>`;
      } else {
        ligne.className = "ligne";
        const moisLigne = groupe._moisCommun ? "" : reference(ind);
        const transversal = filtreChiffres || paysActif === "cours" || paysActif === "banques";
        const paysLigne = transversal ? nomPays[ind.pays] : "";
        const note = [paysLigne, PEUR[ind.note] || ind.note, moisLigne].filter(Boolean).join(" — ");
        ligne.innerHTML = `<span class="ligne-nom">
            <span class="nom">${ech(ind.label)}</span>
            ${note ? `<span class="note">${ech(note)}</span>` : ""}
          </span>
          <span class="ligne-val">
            ${courbe(ind.id)}
            <span class="val">${valeurAffichee(ind)}</span>
            <span class="var ${v.classe}">${v.texte}</span>
          </span>`;
        const trente = ind.evolution_30j;
        ligne.title = [
          ind.source && ind.date ? `${ind.source} — ${ind.date}` : "",
          (trente !== undefined && trente !== null)
            ? `Sur 30 jours : ${trente > 0 ? "+" : ""}${trente}` : ""
        ].filter(Boolean).join("\n");

        // Un chiffre mène aux articles qui en parlent, mais seulement par un
        // lien explicite : rendre toute la ligne cliquable faisait sauter la
        // page au moindre contact.
        if (ind.mots){
          const lien = document.createElement("button");
          lien.type = "button";
          lien.className = "vers-articles";
          lien.textContent = "articles";
          lien.title = `Voir les articles sur « ${ind.mots} »`;
          ligne.querySelector(".ligne-nom").appendChild(lien);
          const ouvrir = () => {
            document.getElementById("recherche").value = ind.mots;
            categorieActive = "tout";
            combienAffiches = PAS_AFFICHAGE;
            vueActive = "actus";
            stockage.ecrire(CLE_VUE, "actus");
            afficherVues(); afficherOnglets(); afficherFlux();
            chercherArchive(ind.mots.toLowerCase());
          };
          lien.addEventListener("click", ouvrir);
        }
      }
      bloc.appendChild(ligne);
    }
    cible.appendChild(bloc);
  }
}

function compter(article){
  const cle = article.source || "inconnu";
  lectures[cle] = (lectures[cle] || 0) + 1;
  stockage.ecrire(CLE_LECTURES, lectures);
}

function affinite(article){
  return lectures[article.source] || 0;
}

function afficherLectures(){
  const zone = document.getElementById("lectures");
  if (!zone.hidden){ zone.hidden = true; return; }

  const produits = {};
  for (const a of donnees.articles){
    produits[a.source] = (produits[a.source] || 0) + 1;
    for (const o of (a.autres || [])) produits[o.source] = (produits[o.source] || 0) + 1;
  }
  const noms = [...new Set([...Object.keys(produits), ...Object.keys(lectures)])];
  noms.sort((a,b) => (lectures[b]||0) - (lectures[a]||0) || (produits[b]||0) - (produits[a]||0));

  const max = Math.max(1, ...noms.map(n => lectures[n] || 0));
  zone.hidden = false;
  zone.innerHTML = `<div class="groupe-tete"><span class="legende">Ce que je lis</span>
      <button class="copier-tout" id="copier-lectures">Copier le relevé</button></div>
    <p class="muet" style="margin:6px 0 10px">Ouvertures depuis ce navigateur, face au nombre de sujets produits.
    Une source qui produit beaucoup et que tu n'ouvres jamais mérite d'être retirée de sources.yaml.</p>` +
    noms.slice(0,25).map(nom => `<div class="ligne">
        <span class="ligne-nom"><span class="nom">${nom}</span>
          <span class="barre" style="width:${Math.round(((lectures[nom]||0)/max)*120)}px"></span></span>
        <span class="ligne-val"><span class="val">${lectures[nom]||0}</span>
          <span class="var">sur ${produits[nom]||0}</span></span>
      </div>`).join("");

  document.getElementById("copier-lectures").addEventListener("click", (e) => {
    const texte = noms.map(n => `${n}\t${lectures[n]||0} ouvert\t${produits[n]||0} produit`).join("\n");
    copier(texte, e.currentTarget, "Relevé copié");
  });
}

/* ---------- archive ---------- */

const moisCharges = {};
let indexArchive = null;

async function chargerMois(mois){
  if (moisCharges[mois]) return moisCharges[mois];
  try{
    const reponse = await fetch(`data/archives/${mois}.json`, {cache:"no-store"});
    moisCharges[mois] = (await reponse.json()).articles || [];
  }catch{ moisCharges[mois] = []; }
  return moisCharges[mois];
}

async function chercherArchive(terme){
  const zone = document.getElementById("archive");
  if (terme.length < 3){ zone.hidden = true; return; }

  if (!indexArchive){
    try{
      const reponse = await fetch("data/archives/index.json", {cache:"no-store"});
      indexArchive = (await reponse.json()).mois || [];
    }catch{ indexArchive = []; }
  }

  const visibles = new Set(donnees.articles.map(a => a.id));
  const trouves = [];
  // Du mois le plus récent au plus ancien, on s'arrête dès qu'on a de quoi répondre.
  for (const entree of indexArchive.slice(0, 18)){
    for (const a of await chargerMois(entree.mois)){
      if (!visibles.has(a.id) && a.titre.toLowerCase().includes(terme)) trouves.push(a);
    }
    if (trouves.length >= 12) break;
  }
  trouves.splice(12);

  zone.hidden = trouves.length === 0;
  if (!trouves.length) return;
  zone.innerHTML = `<div class="groupe-tete"><span class="legende">Dans l'archive</span></div>` +
    trouves.map(a => `<div class="ligne">
      <span class="ligne-nom"><span class="nom"><a href="${a.url}" target="_blank" rel="noopener">${a.titre}</a></span>
      <span class="note">${a.source}</span></span>
      <span class="quand">${fr.date.format(new Date(a.publie_le))}</span></div>`).join("");
}

/* ---------- copie ---------- */

const ICONE_COPIE = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const ICONE_EPINGLE = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-2.8L7 19l1-6-4-4 5.5-.5z"/></svg>';

function texteArticle(a){
  const date = new Date(a.publie_le);
  let texte = `${a.titre}\n${a.source} — ${fr.court.format(date)}\n${a.url}`;
  if (a.autres && a.autres.length){
    texte += "\nAussi chez " + a.autres.map(o => `${o.source} (${o.url})`).join(", ");
  }
  return texte;
}

async function copier(texte, bouton, confirmation){
  const initial = bouton.dataset.initial || bouton.textContent.trim();
  bouton.dataset.initial = initial;
  let reussi = true;
  try{
    await navigator.clipboard.writeText(texte);
  }catch{
    const zone = document.createElement("textarea");
    zone.value = texte;
    zone.setAttribute("readonly","");
    zone.style.position = "fixed";
    zone.style.opacity = "0";
    document.body.appendChild(zone);
    zone.select();
    try{ reussi = document.execCommand("copy"); }catch{ reussi = false; }
    zone.remove();
  }
  const libelle = reussi ? confirmation : "Copie refusée";
  bouton.dataset.fait = reussi ? "oui" : "non";
  if (bouton.querySelector("span")) bouton.querySelector("span").textContent = libelle;
  else bouton.textContent = libelle;
  setTimeout(() => {
    bouton.dataset.fait = "";
    if (bouton.querySelector("span")) bouton.querySelector("span").textContent = initial;
    else bouton.textContent = initial;
  }, 1800);
}

/* ---------- flux ---------- */

function articlesFiltres(){
  const recherche = document.getElementById("recherche").value.trim().toLowerCase();
  const seulementNeufs = document.getElementById("neufs").checked;
  const base = categorieActive === "gardes" ? epingles : donnees.articles;
  const semaine = Date.now() - 7*24*3600*1000;
  const liste = base.filter(a => {
    if (categorieActive === "semaine" && new Date(a.publie_le).getTime() < semaine) return false;
    if (!["tout","gardes","semaine"].includes(categorieActive) && a.categorie !== categorieActive) return false;
    if (seulementNeufs && !estNouveau(a)) return false;
    if (recherche && !(a.titre + " " + a.source).toLowerCase().includes(recherche)) return false;
    return true;
  });

  if (document.getElementById("affinite").checked){
    const classe = [...liste].sort((a,b) => affinite(b) - affinite(a) || b.publie_le.localeCompare(a.publie_le));
    // Plancher de diversité : jamais plus de deux sujets d'affilée d'une même source.
    const reste = [...classe], sortie = [];
    while (reste.length){
      const precedentes = sortie.slice(-2).map(x => x.source);
      let index = reste.findIndex(x => !(precedentes.length === 2 && precedentes[0] === x.source && precedentes[1] === x.source));
      if (index === -1) index = 0;
      sortie.push(reste.splice(index,1)[0]);
    }
    return sortie;
  }
  return liste;
}

function afficherOnglets(){
  const barre = document.getElementById("onglets");
  const neufs = {};
  for (const a of donnees.articles) if (estNouveau(a)) neufs[a.categorie] = (neufs[a.categorie]||0)+1;
  const total = Object.values(neufs).reduce((s,n)=>s+n,0);
  const liste = [{id:"tout",label:"Tout",n:total}]
    .concat(donnees.categories.map(c => ({id:c.id,label:c.label,n:neufs[c.id]||0})))
    .concat([{id:"semaine",label:"La semaine",n:0}])
    .concat(epingles.length ? [{id:"gardes",label:"Gardés",n:0}] : []);

  barre.innerHTML = "";
  for (const o of liste){
    const b = document.createElement("button");
    b.className = "onglet";
    b.setAttribute("aria-pressed", String(o.id === categorieActive));
    b.innerHTML = o.label + (o.n ? `<span class="n">${o.n}</span>` : "");
    b.addEventListener("click", () => { categorieActive = o.id; combienAffiches = PAS_AFFICHAGE; afficherOnglets(); afficherFlux(); });
    barre.appendChild(b);
  }
}

function afficherFlux(){
  const cible = document.getElementById("flux");
  const liste = articlesFiltres();
  cible.innerHTML = "";

  if (!liste.length){
    const neufs = document.getElementById("neufs").checked;
    cible.innerHTML = `<div class="etat">
      <h2>${neufs ? "Rien de neuf depuis ta dernière visite." : "Aucun article ne correspond."}</h2>
      <p>${neufs ? "Le collecteur passe toutes les heures. Décoche « Nouveaux » pour relire les jours précédents."
                 : "Élargis la recherche ou change de rubrique."}</p></div>`;
    return;
  }

  if (categorieActive === "semaine"){
    liste.sort((a,b) => b.score - a.score);
    const bilan = document.createElement("div");
    const bougeurs = (donnees.indicateurs||[]).map(i => {
      const serie = (donnees.courbes||{})[i.id];
      if (!serie || serie.length < 7 || i.statut !== "ok") return null;
      const depart = serie[serie.length-7], arrivee = serie[serie.length-1];
      if (!depart) return null;
      return {label:i.label, ecart:((arrivee/depart)-1)*100, unite:i.unite, arrivee};
    }).filter(Boolean).sort((a,b) => Math.abs(b.ecart) - Math.abs(a.ecart)).slice(0,5);

    bilan.innerHTML = `<div class="groupe-tete"><span class="legende">Les sept derniers jours</span></div>
      ${bougeurs.map(b => `<div class="ligne">
        <span class="ligne-nom"><span class="nom">${b.label}</span></span>
        <span class="ligne-val"><span class="val">${b.arrivee.toLocaleString("fr-FR")}</span>
        <span class="var ${b.ecart>0?"pos":"neg"}">${b.ecart>0?"+":""}${b.ecart.toFixed(2)} %</span></span></div>`).join("")}
      <p class="muet" style="margin:14px 0 0">${liste.length} sujets sur la semaine, les plus marquants d'abord.</p>`;
    cible.appendChild(bilan);
  }

  const visibles = liste.slice(0, combienAffiches);
  let jourCourant = null;
  for (const a of visibles){
    if (categorieActive === "semaine") jourCourant = "—";
    const date = new Date(a.publie_le);
    const jour = fr.jour.format(date);
    if (jour !== jourCourant){
      jourCourant = jour;
      const h = document.createElement("h2");
      h.className = "jour";
      h.textContent = jour;
      cible.appendChild(h);
    }
    const bloc = document.createElement("article");
    bloc.className = "article" + (a.score >= 34 ? " marquant" : "") + (lus.has(a.id) ? " lu" : "");
    const signaux = (a.signaux||[]).slice(0,2).map(s => `<span class="signal">${ech(s)}</span>`).join("");
    bloc.innerHTML = `<a class="titre" href="${ech(a.url)}" target="_blank" rel="noopener">${ech(a.titre)}</a>
      <p class="meta">
        ${estNouveau(a) && !lus.has(a.id) ? '<span class="puce" title="Nouveau"></span>' : ""}
        <span>${ech(a.source)}</span>
        <span${a.date_estimee ? ' title="Ce flux ne date pas ses entrées"' : ""}>${a.date_estimee ? "date incertaine" : fr.heure.format(date)}</span>${signaux}
        <button class="copier" type="button">${ICONE_COPIE}<span>Copier</span></button>
        <button class="epingler" type="button" aria-pressed="${epingles.some(e => e.id === a.id)}">${ICONE_EPINGLE}<span>Garder</span></button>
      </p>
      ${a.resume ? `<p class="extrait">${ech(a.resume)}</p>` : ""}
      ${(a.autres && a.autres.length) ? `<p class="reprises">Aussi chez ${
        a.autres.slice(0,4).map(o => `<a href="${ech(o.url)}" target="_blank" rel="noopener">${ech(o.source)}</a>`).join(", ")
      }${a.autres.length > 4 ? ` et ${a.autres.length - 4} autres` : ""}</p>` : ""}`;

    bloc.querySelector(".epingler").addEventListener("click", (e) => {
      const bouton = e.currentTarget;
      const deja = epingles.some(x => x.id === a.id);
      epingles = deja ? epingles.filter(x => x.id !== a.id) : [{...a, epingle_le:new Date().toISOString()}, ...epingles].slice(0,200);
      stockage.ecrire(CLE_EPINGLES, epingles);
      bouton.setAttribute("aria-pressed", String(!deja));
      afficherOnglets();
    });

    bloc.querySelector(".titre").addEventListener("click", () => {
      compter(a);
      lus.add(a.id);
      stockage.ecrire(CLE_LUS, [...lus].slice(-800));
      bloc.classList.add("lu");
      bloc.querySelector(".puce")?.remove();
    });
    const boutonCopie = bloc.querySelector(".copier");
    boutonCopie.addEventListener("click", () => { compter(a); copier(texteArticle(a), boutonCopie, "Copié"); });
    bloc.querySelectorAll(".reprises a").forEach(lien => {
      lien.addEventListener("click", () => compter({source: lien.textContent}));
    });
    cible.appendChild(bloc);
  }

  if (liste.length > visibles.length){
    const suite = document.createElement("button");
    suite.className = "copier-tout";
    suite.style.marginTop = "26px";
    const restants = liste.length - visibles.length;
    suite.textContent = `Afficher les ${Math.min(PAS_AFFICHAGE, restants)} suivants (${restants} restants)`;
    suite.addEventListener("click", () => { combienAffiches += PAS_AFFICHAGE; afficherFlux(); });
    cible.appendChild(suite);
  }
}

/* ---------- pied et en-tête ---------- */

function afficherContexte(){
  const genere = new Date(donnees.genere_le);
  const age = (Date.now() - genere.getTime()) / 3600000;
  const etat = document.getElementById("etat-maj");
  etat.textContent = fr.court.format(genere);
  etat.classList.toggle("perime", age > 6);
  if (age > 6) etat.title = "Le collecteur n'est pas passé depuis plus de 6 h.";

  const sources = donnees.sources || [];
  const indispo = (donnees.indicateurs||[]).filter(i => i.statut !== "ok").length;
  const morts = sources.filter(s => !s.ok).length;
  const replis = sources.filter(s => s.secours).length;
  const bouts = [`${sources.length - morts}/${sources.length} sources`];
  if (replis) bouts.push(`${replis} en repli`);
  if (indispo) bouts.push(`${indispo} chiffre(s) indisponible(s)`);
  document.getElementById("etat-sources").textContent = bouts.join(", ");
}

async function charger(){
  try{
    const reponse = await fetch("data/feed.json?t=" + Date.now(), {cache:"no-store"});
    if (!reponse.ok) throw new Error(reponse.status);
    donnees = await reponse.json();
    for (const [nom, rendu] of [["contexte",afficherContexte],["alertes",afficherAlertes],
         ["agenda",afficherAgenda],["chiffres clés",afficherHero],["indicateurs",afficherChiffres],
         ["onglets",afficherOnglets],["flux",afficherFlux],["vues",afficherVues]]){
      try{ rendu(); }
      catch(erreur){ signalerErreur(`Affichage « ${nom} »`, erreur); return; }
    }
  }catch(e){
    document.getElementById("flux").innerHTML = `<div class="etat">
      <h2>Les données ne se chargent pas.</h2>
      <p>Le fichier data/feed.json est absent ou invalide. Lance le collecteur une fois, ou vérifie que l'action GitHub est passée au vert.</p></div>`;
    document.getElementById("etat-maj").textContent = "hors ligne";
  }
}

function brancher(id, evenement, action){
  const element = document.getElementById(id);
  if (!element){ console.warn("élément absent :", id); return; }
  element.addEventListener(evenement, action);
}

document.getElementById("recherche").addEventListener("input", (e) => {
  combienAffiches = PAS_AFFICHAGE;
  afficherFlux();
  chercherArchive(e.target.value.trim().toLowerCase());
});
brancher("affinite", "change", afficherFlux);
brancher("voir-lectures", "click", afficherLectures);

brancher("exporter", "click", (e) => {
  copier(JSON.stringify({epingles, lectures}), e.currentTarget, "Copié, colle-le ailleurs");
});

brancher("importer", "click", () => {
  const brut = prompt("Colle ici la sauvegarde copiée depuis ton autre appareil :");
  if (!brut) return;
  try{
    const donneesImportees = JSON.parse(brut);
    const connus = new Set(epingles.map(x => x.id));
    epingles = [...epingles, ...(donneesImportees.epingles || []).filter(x => !connus.has(x.id))].slice(0,200);
    for (const [source, nombre] of Object.entries(donneesImportees.lectures || {})){
      lectures[source] = (lectures[source] || 0) + nombre;
    }
    stockage.ecrire(CLE_EPINGLES, epingles);
    stockage.ecrire(CLE_LECTURES, lectures);
    afficherOnglets(); afficherFlux();
  }catch{
    alert("Sauvegarde illisible. Recopie-la en entier, sans rien couper.");
  }
});
brancher("neufs", "change", () => { combienAffiches = PAS_AFFICHAGE; afficherFlux(); });
brancher("copier-tout", "click", (e) => {
  if (!donnees) return;
  const liste = articlesFiltres();
  if (!liste.length){ copier("", e.currentTarget, "Rien à copier"); return; }
  copier(liste.map(texteArticle).join("\n\n"), e.currentTarget, `${liste.length} copiés`);
});
function marquerToutLu(){
  if (!donnees) return;
  donnees.articles.forEach(a => lus.add(a.id));
  stockage.ecrire(CLE_LUS, [...lus].slice(-800));
  stockage.ecrire(CLE_VISITE, new Date().toISOString());
  location.reload();
}

charger().then(() => {
  addEventListener("pagehide", () => stockage.ecrire(CLE_VISITE, new Date().toISOString()));
});

if ("serviceWorker" in navigator){
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
