<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Veille</title>
<meta name="description" content="Veille financière personnelle : taux, marchés, crypto, macro.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E2129">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icone-192.png">
<link rel="icon" href="icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Spline+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --encre:#0E2129;
  --surface:#132C36;
  --surface-haute:#183742;
  --trait:#26454F;
  --texte:#E7EEEA;
  --texte-doux:#9AB2B2;
  --hausse:#57A883;
  --baisse:#CB6248;
  --laiton:#D6A74C;
  --focus:#79C3D9;
  --serif:"Newsreader",Georgia,serif;
  --sans:"Spline Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --l:clamp(16px,4vw,28px);
}
@media (prefers-color-scheme:light){
  :root{
    --encre:#EEF1ED;--surface:#FFFFFF;--surface-haute:#F5F7F3;--trait:#D4DCD6;
    --texte:#12272F;--texte-doux:#5E7278;--hausse:#1F7A5C;--baisse:#AC4429;
    --laiton:#9A7419;--focus:#1D6A80;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--encre);color:var(--texte);font-family:var(--sans);
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;
  padding:0 var(--l) calc(64px + env(safe-area-inset-bottom));
}
.enveloppe{max-width:1080px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}

/* ---------- en-tête ---------- */
.entete{display:flex;align-items:baseline;justify-content:space-between;gap:16px;
  padding:calc(20px + env(safe-area-inset-top)) 0 14px;flex-wrap:wrap}
.marque{font-family:var(--serif);font-size:28px;font-weight:500;letter-spacing:-.01em;margin:0}
.horodatage{font-size:13px;color:var(--texte-doux);font-variant-numeric:tabular-nums}
.horodatage.perime{color:var(--laiton)}

/* ---------- résumé ---------- */
.resume{font-family:var(--serif);font-size:clamp(19px,3.4vw,25px);line-height:1.42;
  margin:8px 0 28px;max-width:62ch;border-left:3px solid var(--laiton);padding-left:18px}

/* ---------- chiffres ---------- */
.chiffres{display:grid;gap:26px;margin-bottom:34px}
@media(min-width:720px){.chiffres{grid-template-columns:1fr 1fr;gap:26px 44px}}
.bloc h2{font-size:13px;font-weight:600;color:var(--texte-doux);margin:0 0 6px;letter-spacing:.02em}
.ligne{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:9px 0;border-top:1px solid var(--trait)}
.ligne .nom{font-size:15px}
.ligne .droite{display:flex;align-items:baseline;gap:10px}
.valeur{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.delta{font-size:13px;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.delta.pos{color:var(--hausse)} .delta.neg{color:var(--baisse)}
.delta.vide{color:var(--texte-doux)}
.indispo{font-size:13px;color:var(--texte-doux);font-style:italic}

/* ---------- filtres ---------- */
.filtres{position:sticky;top:0;z-index:5;background:var(--encre);
  padding:10px 0 12px;border-bottom:1px solid var(--trait);margin-bottom:6px}
.onglets{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.onglets::-webkit-scrollbar{display:none}
.onglet{white-space:nowrap;padding:7px 13px;border-radius:999px;font-size:14px;
  color:var(--texte-doux);border:1px solid var(--trait)}
.onglet[aria-pressed="true"]{background:var(--surface-haute);color:var(--texte);border-color:var(--texte-doux)}
.onglet .compteur{font-variant-numeric:tabular-nums;opacity:.65;margin-left:6px}
.outils{display:flex;gap:10px;align-items:center;margin-top:10px}
.recherche{flex:1;background:var(--surface);border:1px solid var(--trait);border-radius:8px;
  padding:9px 12px;color:var(--texte);font-size:15px}
.recherche::placeholder{color:var(--texte-doux)}
.bascule{font-size:14px;color:var(--texte-doux);display:flex;align-items:center;gap:7px;white-space:nowrap}
.bascule input{accent-color:var(--laiton);width:17px;height:17px}

/* ---------- flux ---------- */
.jour{font-size:13px;color:var(--texte-doux);margin:26px 0 2px;font-variant-numeric:tabular-nums}
.article{display:block;padding:15px 0 15px 14px;border-top:1px solid var(--trait);
  border-left:2px solid transparent;text-decoration:none}
.article:first-of-type{border-top:none}
.article.marquant{border-left-color:var(--laiton)}
.article.lu .titre{color:var(--texte-doux)}
.titre{font-family:var(--serif);font-size:19px;line-height:1.32;margin:0 0 5px;font-weight:400;max-width:70ch}
.meta{font-size:13px;color:var(--texte-doux);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.pastille{width:6px;height:6px;border-radius:50%;background:var(--laiton);display:inline-block}
.extrait{font-size:14px;color:var(--texte-doux);margin:6px 0 0;max-width:72ch;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.signal{font-size:12px;color:var(--laiton)}

/* ---------- états ---------- */
.etat{padding:48px 0;max-width:46ch}
.etat p{margin:0 0 10px}
.etat .titre-etat{font-family:var(--serif);font-size:21px;margin:0 0 8px}
.lien-action{color:var(--focus);text-decoration:underline;text-underline-offset:3px}
.pied{margin-top:44px;padding-top:16px;border-top:1px solid var(--trait);
  font-size:13px;color:var(--texte-doux);display:flex;gap:16px;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){
  .article{transition:border-left-color .15s ease}
}
</style>
</head>
<body>
<div class="enveloppe">

  <header class="entete">
    <h1 class="marque">Veille</h1>
    <div class="horodatage" id="horodatage">chargement…</div>
  </header>

  <p class="resume" id="resume" hidden></p>

  <section class="chiffres" id="chiffres" aria-label="Chiffres de référence"></section>

  <nav class="filtres" aria-label="Filtres">
    <div class="onglets" id="onglets"></div>
    <div class="outils">
      <input class="recherche" id="recherche" type="search" placeholder="Chercher un mot" aria-label="Chercher dans les titres">
      <label class="bascule"><input type="checkbox" id="neufs"> Nouveaux</label>
    </div>
  </nav>

  <main id="flux"></main>

  <footer class="pied">
    <span id="etat-sources"></span>
    <button class="lien-action" id="rafraichir">Recharger</button>
    <button class="lien-action" id="tout-lu">Tout marquer comme lu</button>
  </footer>
</div>

<script>
const CLE_VISITE = "veille:derniere-visite";
const CLE_LUS = "veille:lus";

const stockage = {
  lire(cle, defaut) {
    try { const v = localStorage.getItem(cle); return v === null ? defaut : JSON.parse(v); }
    catch { return defaut; }
  },
  ecrire(cle, valeur) {
    try { localStorage.setItem(cle, JSON.stringify(valeur)); } catch {}
  }
};

let donnees = null;
let categorieActive = "tout";
let lus = new Set(stockage.lire(CLE_LUS, []));
const visitePrecedente = stockage.lire(CLE_VISITE, null);

const fr = {
  heure: new Intl.DateTimeFormat("fr-FR", { hour: "2-digit", minute: "2-digit" }),
  jour: new Intl.DateTimeFormat("fr-FR", { weekday: "long", day: "numeric", month: "long" }),
  court: new Intl.DateTimeFormat("fr-FR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })
};

const estNouveau = (a) => !visitePrecedente || a.premiere_vue > visitePrecedente;

function nombre(valeur, unite) {
  if (valeur === null || valeur === undefined) return "—";
  const decimales = unite === "%" ? 2 : (Math.abs(valeur) >= 1000 ? 0 : 2);
  return valeur.toLocaleString("fr-FR", { minimumFractionDigits: decimales, maximumFractionDigits: decimales });
}

function delta(ind) {
  if (ind.variation_pct !== null && ind.variation_pct !== undefined) {
    const signe = ind.variation_pct > 0 ? "+" : "";
    return { texte: signe + ind.variation_pct.toFixed(2) + " %", classe: ind.variation_pct > 0 ? "pos" : ind.variation_pct < 0 ? "neg" : "vide" };
  }
  if (ind.variation !== null && ind.variation !== undefined && ind.variation !== 0) {
    const signe = ind.variation > 0 ? "+" : "";
    return { texte: signe + ind.variation.toFixed(2) + " pt", classe: ind.variation > 0 ? "pos" : "neg" };
  }
  return { texte: "stable", classe: "vide" };
}

function afficherChiffres(indicateurs) {
  const groupes = [
    { id: "taux", titre: "Taux de référence" },
    { id: "marches", titre: "Marchés" },
    { id: "crypto", titre: "Crypto" }
  ];
  const cible = document.getElementById("chiffres");
  cible.innerHTML = "";

  for (const groupe of groupes) {
    const membres = indicateurs.filter(i => i.groupe === groupe.id);
    if (!membres.length) continue;
    const bloc = document.createElement("div");
    bloc.className = "bloc";
    bloc.innerHTML = `<h2>${groupe.titre}</h2>`;
    for (const ind of membres) {
      const ligne = document.createElement("div");
      ligne.className = "ligne";
      if (ind.statut !== "ok") {
        ligne.innerHTML = `<span class="nom">${ind.label}</span><span class="indispo">indisponible</span>`;
      } else {
        const d = delta(ind);
        const unite = ind.unite === "%" ? " %" : ind.unite === "€" ? " €" : "";
        ligne.innerHTML =
          `<span class="nom">${ind.label}</span>
           <span class="droite">
             <span class="valeur">${nombre(ind.valeur, ind.unite)}${unite}</span>
             <span class="delta ${d.classe}">${d.texte}</span>
           </span>`;
      }
      bloc.appendChild(ligne);
    }
    cible.appendChild(bloc);
  }
}

function articlesFiltres() {
  const recherche = document.getElementById("recherche").value.trim().toLowerCase();
  const seulementNeufs = document.getElementById("neufs").checked;
  return donnees.articles.filter(a => {
    if (categorieActive !== "tout" && a.categorie !== categorieActive) return false;
    if (seulementNeufs && !estNouveau(a)) return false;
    if (recherche && !(a.titre + " " + a.source).toLowerCase().includes(recherche)) return false;
    return true;
  });
}

function afficherOnglets() {
  const barre = document.getElementById("onglets");
  const neufsParCategorie = {};
  for (const a of donnees.articles) {
    if (estNouveau(a)) neufsParCategorie[a.categorie] = (neufsParCategorie[a.categorie] || 0) + 1;
  }
  const totalNeuf = Object.values(neufsParCategorie).reduce((s, n) => s + n, 0);
  const onglets = [{ id: "tout", label: "Tout", n: totalNeuf }]
    .concat(donnees.categories.map(c => ({ id: c.id, label: c.label, n: neufsParCategorie[c.id] || 0 })));

  barre.innerHTML = "";
  for (const o of onglets) {
    const bouton = document.createElement("button");
    bouton.className = "onglet";
    bouton.setAttribute("aria-pressed", String(o.id === categorieActive));
    bouton.innerHTML = o.label + (o.n ? `<span class="compteur">${o.n}</span>` : "");
    bouton.addEventListener("click", () => {
      categorieActive = o.id;
      afficherOnglets();
      afficherFlux();
    });
    barre.appendChild(bouton);
  }
}

function afficherFlux() {
  const cible = document.getElementById("flux");
  const liste = articlesFiltres();
  cible.innerHTML = "";

  if (!liste.length) {
    const neufs = document.getElementById("neufs").checked;
    cible.innerHTML = `<div class="etat">
      <p class="titre-etat">${neufs ? "Rien de neuf depuis ta dernière visite." : "Aucun article ne correspond."}</p>
      <p>Le collecteur passe toutes les heures. ${neufs ? "Décoche « Nouveaux » pour relire les jours précédents." : "Élargis la recherche ou change de rubrique."}</p>
    </div>`;
    return;
  }

  let jourCourant = null;
  for (const a of liste) {
    const date = new Date(a.publie_le);
    const jour = fr.jour.format(date);
    if (jour !== jourCourant) {
      jourCourant = jour;
      const titreJour = document.createElement("h2");
      titreJour.className = "jour";
      titreJour.textContent = jour;
      cible.appendChild(titreJour);
    }

    const lien = document.createElement("a");
    lien.className = "article" + (a.score >= 34 ? " marquant" : "") + (lus.has(a.id) ? " lu" : "");
    lien.href = a.url;
    lien.target = "_blank";
    lien.rel = "noopener";

    const signaux = (a.signaux || []).slice(0, 2).map(s => `<span class="signal">${s}</span>`).join("");
    lien.innerHTML =
      `<h3 class="titre">${a.titre}</h3>
       <p class="meta">
         ${estNouveau(a) && !lus.has(a.id) ? '<span class="pastille" title="Nouveau"></span>' : ""}
         <span>${a.source}</span><span>${fr.heure.format(date)}</span>${signaux}
       </p>
       ${a.resume ? `<p class="extrait">${a.resume}</p>` : ""}`;

    lien.addEventListener("click", () => {
      lus.add(a.id);
      stockage.ecrire(CLE_LUS, [...lus].slice(-800));
      lien.classList.add("lu");
      lien.querySelector(".pastille")?.remove();
    });
    cible.appendChild(lien);
  }
}

function afficherEntete() {
  const genere = new Date(donnees.genere_le);
  const ageHeures = (Date.now() - genere.getTime()) / 3600000;
  const horodatage = document.getElementById("horodatage");
  horodatage.textContent = "mis à jour " + fr.court.format(genere);
  horodatage.classList.toggle("perime", ageHeures > 6);
  if (ageHeures > 6) horodatage.title = "Le collecteur n'est pas passé depuis plus de 6 h.";

  if (donnees.resume) {
    const bloc = document.getElementById("resume");
    bloc.textContent = donnees.resume;
    bloc.hidden = false;
  }

  const enEchec = (donnees.sources || []).filter(s => !s.ok).length;
  document.getElementById("etat-sources").textContent =
    enEchec ? `${enEchec} source(s) à corriger` : `${(donnees.sources || []).length} sources actives`;
}

async function charger() {
  try {
    const reponse = await fetch("data/feed.json?t=" + Date.now(), { cache: "no-store" });
    if (!reponse.ok) throw new Error(reponse.status);
    donnees = await reponse.json();
    afficherEntete();
    afficherChiffres(donnees.indicateurs || []);
    afficherOnglets();
    afficherFlux();
  } catch (e) {
    document.getElementById("flux").innerHTML = `<div class="etat">
      <p class="titre-etat">Les données ne se chargent pas.</p>
      <p>Le fichier data/feed.json est absent ou invalide. Lance le collecteur une fois, ou vérifie que l'action GitHub est bien passée au vert.</p>
    </div>`;
    document.getElementById("horodatage").textContent = "hors ligne";
  }
}

document.getElementById("recherche").addEventListener("input", () => afficherFlux());
document.getElementById("neufs").addEventListener("change", () => afficherFlux());
document.getElementById("rafraichir").addEventListener("click", charger);
document.getElementById("tout-lu").addEventListener("click", () => {
  if (!donnees) return;
  donnees.articles.forEach(a => lus.add(a.id));
  stockage.ecrire(CLE_LUS, [...lus].slice(-800));
  stockage.ecrire(CLE_VISITE, new Date().toISOString());
  location.reload();
});

charger().then(() => {
  // La visite courante ne devient la référence « déjà vu » qu'en quittant la page.
  addEventListener("pagehide", () => stockage.ecrire(CLE_VISITE, new Date().toISOString()));
});

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
